[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeflow-community-connectors-iceberg"
version = "0.1.0"
description = "Apache Iceberg REST Catalog connector for Lakeflow Community Connectors"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0,<3.0",
    "lakeflow-community-connectors>=0.1.0",
]

[project.optional-dependencies]
# Row-data reads go through pyiceberg. The six catalog metadata streams are
# plain REST calls and work without it, so it stays optional.
data = [
    "pyiceberg[pyarrow]>=0.7.0,<1.0",
]
dev = [
    "pyspark>=4.2.0.dev0",
    "pytest>=7.0.0,<9.0",
    "pytest-cov>=4.0.0,<7.0",
]

[tool.setuptools]
packages = ["databricks.labs.community_connector.sources.iceberg"]

[tool.setuptools.package-dir]
"databricks.labs.community_connector.sources.iceberg" = "."

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.yaml"]
